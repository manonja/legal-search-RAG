[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-search-rag"
version = "0.1.0"
description = "Legal search RAG project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Legal Search Team" }]
dependencies = [
    "numpy>=1.0.0,<2.0.0",
    "python-docx>=0.8.11",
    "google-generativeai",
    "chromadb>=0.6.3,<0.7.0",
    "langchain>=0.3.22,<0.4.0",
    "openai>=1.70.0,<1.80.0",
    "google-cloud-storage>=3.1.0,<4",
    "fastapi>=0.115.12,<0.116.0",
    "uvicorn>=0.34.0,<0.35.0",
    "pydantic>=2.11.1,<2.12.0",
    "onnxruntime>=1.21.0",
    "onnx",
    "chroma-hnswlib>=0.7.1",
    "sentry-sdk[fastapi]>=2.25.0",
    "aiofiles>=23.2.1",
    "pymupdf>=1.25.5",
    "pydantic-settings>=2.8.1",
    "python-multipart>=0.0.20",
]


[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build]
include = [
    "VERSION",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff>=0.11.2,<0.12",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "pluggy>=1.5.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.0",
    "pytest-mock>=3.14.0",
]
